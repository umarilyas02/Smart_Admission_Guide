<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Test Cases — Smart Admission Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue:    #2563EB;
    --green:   #16A34A;
    --red:     #DC2626;
    --bg:      #F8FAFC;
    --surface: #FFFFFF;
    --border:  #E5E7EB;
    --text:    #111827;
    --muted:   #6B7280;
  }

  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.6; }

  .topbar { background: linear-gradient(135deg, #1E40AF 0%, #2563EB 100%); color: #fff; padding: 28px 40px 24px; }
  .topbar h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
  .topbar p  { font-size: 12px; opacity: .75; margin-top: 4px; }
  .topbar-meta { font-size: 11px; opacity: .6; margin-top: 6px; }

  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 20px 40px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .stat-card { border-radius: 10px; padding: 14px 18px; text-align: center; border: 1px solid; }
  .stat-card.total { background: #EFF6FF; border-color: #BFDBFE; }
  .stat-card.pass  { background: #F0FDF4; border-color: #BBF7D0; }
  .stat-card.fail  { background: #FEF2F2; border-color: #FECACA; }
  .stat-card.pct   { background: #F5F3FF; border-color: #DDD6FE; }
  .stat-num { font-size: 28px; font-weight: 700; }
  .stat-card.total .stat-num { color: var(--blue); }
  .stat-card.pass  .stat-num { color: var(--green); }
  .stat-card.fail  .stat-num { color: var(--red); }
  .stat-card.pct   .stat-num { color: #7C3AED; }
  .stat-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-top: 2px; }

  .progress-wrap { padding: 14px 40px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; }
  .progress-bar  { flex: 1; height: 8px; background: #F3F4F6; border-radius: 99px; overflow: hidden; display: flex; }
  .pb-pass { background: var(--green); height: 100%; }
  .pb-fail { background: var(--red);   height: 100%; }
  .progress-legend { display: flex; gap: 14px; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .legend-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }

  .controls { padding: 14px 40px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; background: var(--bg); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; }
  .search-box { flex: 1; min-width: 180px; padding: 7px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); font-family: inherit; font-size: 13px; outline: none; }
  .search-box:focus { border-color: var(--blue); box-shadow: 0 0 0 2px #BFDBFE; }
  .filter-select { padding: 7px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); font-family: inherit; font-size: 13px; outline: none; cursor: pointer; color: var(--text); }
  .filter-select:focus { border-color: var(--blue); }
  .btn-print { padding: 7px 16px; background: var(--blue); color: #fff; border: none; border-radius: 8px; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer; }
  .btn-print:hover { background: #1D4ED8; }
  .btn-expand-all { padding: 7px 16px; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer; }
  .btn-expand-all:hover { background: #F3F4F6; }

  .content { padding: 24px 40px 60px; }
  .module-group { margin-bottom: 10px; }
  .module-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); padding: 8px 0 4px; }

  .tc-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 10px; margin-bottom: 6px; overflow: hidden; }
  .tc-card.pass { border-color: #BBF7D0; }
  .tc-card.fail { border-color: #FECACA; }

  .tc-header { display: flex; align-items: center; gap: 12px; padding: 13px 16px; cursor: pointer; user-select: none; }
  .tc-header:hover { background: #FAFAFA; }

  .status-icon { flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .status-icon.pass { background: #DCFCE7; }
  .status-icon.fail { background: #FEE2E2; }
  .status-icon svg  { width: 12px; height: 12px; }

  .tc-meta { flex: 1; min-width: 0; }
  .tc-meta-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 3px; }
  .tc-id        { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted); }
  .tc-table-ref { font-size: 10px; color: #9CA3AF; }

  .badge { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 99px; border: 1px solid; }
  .badge.pass   { background: #F0FDF4; color: #15803D; border-color: #BBF7D0; }
  .badge.fail   { background: #FEF2F2; color: #B91C1C; border-color: #FECACA; }
  .badge.high   { background: #FEF3C7; color: #92400E; border-color: #FDE68A; }
  .badge.medium { background: #EFF6FF; color: #1D4ED8; border-color: #BFDBFE; }

  .tc-title  { font-size: 13.5px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tc-module { font-size: 11px; color: var(--muted); }
  .chevron   { flex-shrink: 0; transition: transform .2s; color: var(--muted); }
  .chevron.open { transform: rotate(180deg); }

  .tc-body { display: none; border-top: 1px solid var(--border); padding: 16px; }
  .tc-body.open { display: block; }

  .tc-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; margin-bottom: 14px; font-size: 12px; }
  .tc-info-grid .label { font-weight: 600; color: #374151; }
  .tc-info-grid .val   { color: var(--muted); }
  .tc-info-grid .full  { grid-column: 1 / -1; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; border-radius: 8px; overflow: hidden; }
  thead tr { background: #F9FAFB; }
  thead th { text-align: left; padding: 8px 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; font-size: 10px; letter-spacing: .5px; border-bottom: 1px solid var(--border); }
  tbody tr { border-bottom: 1px solid #F3F4F6; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:nth-child(even) { background: #FAFAFA; }
  td { padding: 8px 10px; vertical-align: top; color: #374151; }
  td.step-num  { color: var(--muted); font-weight: 500; font-size: 11px; width: 30px; }
  td.data-cell { color: var(--muted); font-style: italic; }

  .step-status { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 99px; border: 1px solid; font-size: 10px; font-weight: 600; }
  .step-status.pass { background: #F0FDF4; color: #15803D; border-color: #BBF7D0; }
  .step-status.fail { background: #FEF2F2; color: #B91C1C; border-color: #FECACA; }
  .step-dot { width: 6px; height: 6px; border-radius: 50%; }
  .pass .step-dot { background: #16A34A; }
  .fail .step-dot { background: #DC2626; }

  td.actual      { font-size: 11px; color: #4B5563; }
  td.notes-cell  { font-size: 11px; color: #9CA3AF; font-style: italic; }

  .post-condition { margin-top: 12px; padding: 10px 12px; background: #F9FAFB; border-left: 3px solid #D1D5DB; border-radius: 0 6px 6px 0; font-size: 11.5px; color: var(--muted); }
  .post-condition strong { color: var(--text); }

  .no-results { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 14px; }

  @media print {
    .controls, .topbar { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .controls  { position: static; }
    .tc-body   { display: block !important; }
    .chevron   { display: none; }
    body       { font-size: 11px; }
  }
  @media (max-width: 640px) {
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .content, .controls, .stats-row, .progress-wrap, .topbar { padding-left: 16px; padding-right: 16px; }
    .tc-info-grid { grid-template-columns: 1fr; }
    .tc-info-grid .full { grid-column: 1; }
    .col-data, .col-actual { display: none; }
  }
</style>
</head>

}

function stepBadge(s) {
  return `<span class="step-status ${s}"><span class="step-dot"></span>${s === 'pass' ? 'Pass' : 'Fail'}</span>`;
}

function renderCards(list) {
  const el = document.getElementById('content');
  el.innerHTML = '';
  if (!list.length) { el.innerHTML = '<div class="no-results">No test cases match your filters.</div>'; return; }

  const groups = {};
  list.forEach(tc => { if (!groups[tc.module]) groups[tc.module] = []; groups[tc.module].push(tc); });

  Object.entries(groups).forEach(([mod, cases]) => {
    const g = document.createElement('div');
    g.className = 'module-group';
    g.innerHTML = `<div class="module-label">${mod}</div>`;

    cases.forEach(tc => {
      const card = document.createElement('div');
      card.className = `tc-card ${tc.status}`;
      card.dataset.module = tc.module;
      card.dataset.status = tc.status;
      card.dataset.search = (tc.title + ' ' + tc.id + ' ' + tc.module).toLowerCase();

      const rows = tc.steps.map(s => `
        <tr>
          <td class="step-num">${s.n}</td>
          <td>${s.step}</td>
          <td class="data-cell col-data">${s.data || '—'}</td>
          <td>${s.expected}</td>
          <td class="actual col-actual">${s.actual}</td>
          <td style="text-align:center">${stepBadge(s.status)}</td>
          <td class="notes-cell col-actual">${s.notes || '—'}</td>
        </tr>`).join('');

      card.innerHTML = `
        <div class="tc-header" onclick="toggleCard(this)">
          <div class="status-icon ${tc.status}">${statusIcon(tc.status)}</div>
          <div class="tc-meta">
            <div class="tc-meta-top">
              <span class="tc-id">${tc.id}</span>
              <span class="tc-table-ref">· Table ${tc.tableNum}</span>
              <span class="badge ${tc.status}">${tc.status === 'pass' ? 'Pass' : 'Fail'}</span>
              ${tc.priority ? `<span class="badge ${tc.priority.toLowerCase()}">${tc.priority}</span>` : ''}
            </div>
            <div class="tc-title">TC-${String(tc.num).padStart(2,'0')} — ${tc.title}</div>
            <div class="tc-module">${tc.module}</div>
          </div>
          <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="tc-body">
          <div class="tc-info-grid">
            <div class="full"><span class="label">Description: </span><span class="val">${tc.desc}</span></div>
            <div><span class="label">Pre-condition: </span><span class="val">${tc.pre}</span></div>
            <div><span class="label">Designer: </span><span class="val">Neelam Shehzadi &nbsp;·&nbsp; 05/01/2026</span></div>
          </div>
          <div style="overflow-x:auto;border-radius:8px;border:1px solid #E5E7EB;">
            <table>
              <thead><tr>
                <th style="width:30px">#</th>
                <th>Test Step</th>
                <th class="col-data">Test Data</th>
                <th>Expected Result</th>
                <th class="col-actual">Actual Result</th>
                <th style="text-align:center;width:72px">Status</th>
                <th class="col-actual">Notes</th>
              </tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
          <div class="post-condition"><strong>Post-condition:</strong> ${tc.post}</div>
        </div>`;
      g.appendChild(card);
    });
    el.appendChild(g);
  });
}

function toggleCard(header) {
  header.nextElementSibling.classList.toggle('open');
  header.querySelector('.chevron').classList.toggle('open');
}

function toggleAll() {
  allExpanded = !allExpanded;
  document.querySelectorAll('.tc-body').forEach(b => b.classList.toggle('open', allExpanded));
  document.querySelectorAll('.chevron').forEach(c => c.classList.toggle('open', allExpanded));
  document.querySelector('.btn-expand-all').textContent = allExpanded ? 'Collapse All' : 'Expand All';
}

function filterCases() {
  const q   = document.getElementById('searchBox').value.toLowerCase();
  const mod = document.getElementById('moduleFilter').value;
  const st  = document.getElementById('statusFilter').value;
  renderCards(TC.filter(tc =>
    (mod === 'all' || tc.module === mod) &&
    (st  === 'all' || tc.status === st)  &&
    (!q  || tc.dataset && tc.dataset.search.includes(q) || (tc.title + tc.id + tc.module).toLowerCase().includes(q))
  ));
}

renderCards(TC);
</script>
</body>
</html>
